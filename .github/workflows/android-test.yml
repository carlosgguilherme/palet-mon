# Compara o motor Kotlin com o C#, compila o APK e usa cada tela em um emulador, tirando fotos.
name: Testar Android

on:
  push:
    branches: ['feat/android-nativo']
  workflow_dispatch:
    inputs:
      version:
        description: Versão do APK de teste (menor que a última release, para testar a atualização)
        default: 2.1.9

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      PALETMON_GOLDEN: ${{ github.workspace }}/golden.txt
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Gerar resultados do motor C#
        run: dotnet run --project PaletMon.Snap -c Release -- --golden "$PALETMON_GOLDEN"

      - name: Comparar motor Kotlin com C#
        working-directory: android
        run: ./gradlew testDebugUnitTest

      - name: Compilar APK
        working-directory: android
        run: ./gradlew assembleRelease -PappVersion=${{ inputs.version || '2.1.9' }} -PsignWithDebug=true

      - run: cp android/app/build/outputs/apk/release/app-release.apk Palet-Mon-Android.apk

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: Palet-Mon-Android.apk

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: relatorio-testes
          path: android/app/build/reports/tests

      - name: Ativar aceleração do emulador
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Abrir no emulador
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: bash .github/scripts/android-smoke.sh Palet-Mon-Android.apk telas

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: telas
          path: telas
