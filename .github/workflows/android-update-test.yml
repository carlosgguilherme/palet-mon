# Instala uma versão antiga de um rascunho de release e deixa o app se atualizar pela última release.
name: Testar atualização Android

on:
  workflow_dispatch:
    inputs:
      draft:
        description: Tag do rascunho com o APK antigo
        default: teste-atualizacao
      expected:
        description: Versão esperada depois de atualizar
        required: true

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Baixar APK antigo
        run: gh release download "${{ inputs.draft }}" --pattern '*.apk' --output antigo.apk

      - name: Ativar aceleração do emulador
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Atualizar no emulador
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: bash .github/scripts/android-update.sh antigo.apk telas "${{ inputs.expected }}"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: telas-atualizacao
          path: telas
